[package]
name = "beanxapo"
version = "0.1.0"
edition = "2021"
description = "beanxsound Audio Processing Object (pass-through spike)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Apo",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
] }

# The DLL lives inside audiodg. A panic must never abort that process.
[profile.release]
panic = "unwind"
opt-level = 2
strip = true
