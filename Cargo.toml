[package]
name = "beanxsound"
version = "0.1.0"
edition = "2021"
description = "beanxsound - a Windows audio control center with FxSound integration"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Dwm",
] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
